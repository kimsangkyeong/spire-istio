# ==============================================================================
# 06. SpireOIDCDiscoveryProvider CR
# ==============================================================================
# 목적: SPIRE OIDC Discovery Provider 배포
#       - SPIFFE ID를 OIDC 호환 JWT로 노출
#       - Istio pilot이 SPIRE 발급 JWT를 검증하는데 사용
#       - /.well-known/openid-configuration 엔드포인트 제공
# 배포형태: Deployment
# 순서: SpiffeCSIDriver CR 생성 및 Ready 상태 확인 후
# ==============================================================================
#
# 적용 전 환경변수:
# export JWT_ISSUER="https://oidc-discovery.$(oc get ingresses.config/cluster -o jsonpath='{.spec.domain}')"
#
# 적용:
# oc apply -f 06-spire-oidc-provider.yaml
#
# 검증:
# oc get deployment -l app.kubernetes.io/name=spiffe-oidc-discovery-provider -n zero-trust-workload-identity-manager
# oc get route -n zero-trust-workload-identity-manager | grep oidc
# curl https://oidc-discovery.<apps-domain>/.well-known/openid-configuration
# ==============================================================================

apiVersion: operator.openshift.io/v1alpha1
kind: SpireOIDCDiscoveryProvider
metadata:
  name: cluster
spec:
  # --- 로깅 설정 ---
  logLevel: "info"          # debug, info, warn, error
  logFormat: "text"         # text, json

  # CSI 드라이버 이름 (SpiffeCSIDriver.spec.pluginName과 일치)
  csiDriverName: "csi.spiffe.io"

  # JWT Issuer URL (SpireServer.spec.jwtIssuer와 반드시 동일)
  jwtIssuer: "https://oidc-discovery.apps.ocp4.example.com"  # <-- 실제 값으로 변경

  # 레플리카 수 (1~5)
  replicaCount: 1

  # OpenShift Route 자동 생성 여부
  # "true": Operator가 *.apps.<domain> Route를 자동 생성/관리
  # "false": 수동으로 Route 또는 Ingress 구성 필요
  managedRoute: "true"

  # 외부 TLS Secret 참조 (선택)
  # 자체 TLS 인증서를 사용할 경우 Secret 이름 지정
  # externalSecretRef: "my-oidc-tls-secret"
