# ==============================================================================
# 10. NGINX IC Plus VirtualServer 예시
# ==============================================================================
# 목적: 외부 트래픽을 NGINX IC Plus를 통해 클러스터 내부 서비스로 전달
#       - F5 BIG-IP → CIS → NGINX IC Plus → K8s Service
#       - 단일 서비스로의 라우팅 (내부 세밀한 라우팅은 Istio VirtualService가 담당)
# 주의: NGINX IC Plus는 mesh 밖에서 운영됨 (sidecar injection 대상 아님)
# ==============================================================================
#
# 적용:
# oc apply -f 10-nginx-virtualserver.yaml
#
# 검증:
# oc get virtualserver -n app-frontend
# oc describe virtualserver app-frontend-vs -n app-frontend
# ==============================================================================

apiVersion: k8s.nginx.org/v1
kind: VirtualServer
metadata:
  name: app-frontend-vs
  namespace: app-frontend
spec:
  # 외부 접근 호스트명 (F5가 이 호스트로 트래픽 전달)
  host: app-frontend.apps.ocp4.example.com   # <-- 실제 도메인으로 변경

  upstreams:
    - name: frontend-upstream
      service: frontend-svc
      port: 80
      # 헬스체크 설정 (선택)
      healthCheck:
        enable: true
        path: /health
        interval: 10s
        jitter: 2s
        fails: 3
        passes: 2

  routes:
    - path: /
      action:
        pass: frontend-upstream

---
# ==============================================================================
# 연관 Service (NGINX IC가 트래픽을 전달하는 대상)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: app-frontend
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
